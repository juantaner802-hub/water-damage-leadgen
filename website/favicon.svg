<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark navy rounded square background -->
  <rect width="64" height="64" rx="12" fill="#0f1f35"/>

  <!-- Large clean water drop shape -->
  <path d="M32 8 C32 8 14 30 14 40 C14 50 22 56 32 56 C42 56 50 50 50 40 C50 30 32 8 32 8Z"
        fill="#1B4F8A"/>

  <!-- Inner highlight — lighter blue giving depth to drop -->
  <path d="M32 16 C32 16 20 33 20 40 C20 47 25.5 52 32 52 C38.5 52 44 47 44 40 C44 33 32 16 32 16Z"
        fill="#2563a8"/>

  <!-- Shine reflection top left of drop — makes it look glossy/real -->
  <ellipse cx="26" cy="34" rx="3.5" ry="5.5" fill="white" opacity="0.18" transform="rotate(-20 26 34)"/>

  <!-- Small white ripple lines at bottom of drop -->
  <path d="M24 46 Q28 43.5 32 46 Q36 48.5 40 46"
        stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M27 50 Q29.5 48.5 32 50 Q34.5 51.5 37 50"
        stroke="white" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.25"/>
</svg>
